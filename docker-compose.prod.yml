# Production stack for a single Linux VM:  app + Postgres + Caddy (automatic HTTPS).
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://welcome:${POSTGRES_PASSWORD}@db:5432/welcome_popup
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3000"

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: welcome
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: welcome_popup
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U welcome -d welcome_popup"]
      interval: 5s
      timeout: 5s
      retries: 10
    # not published: only the app container can reach the database

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  caddy_data:
  caddy_config:
